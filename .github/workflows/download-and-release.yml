name: Download TikTok Videos → GitHub Release

on:
  schedule:
    # daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag prefix (default: daily)'
        required: false
        default: 'daily'
      creator:
        description: 'Override: single TikTok creator username to source from'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release + upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp + ffmpeg + jq + curl-cffi (for TikTok impersonation)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq
          python3 -m pip install --quiet "yt-dlp[curl-cffi]"

      - name: Source list — trending creators
        id: src
        run: |
          if [ -n "${{ inputs.creator }}" ]; then
            printf '%s\n' "${{ inputs.creator }}" > sources.txt
          else
            # A small rotation of high-profile public creators whose content
            # trends on the FYP. Rotation spreads load + gives variety.
            ROTATE=$(date -u +%j)
            case $(( ROTATE % 3 )) in
              0) printf '%s\n' "tiktok" "mrbeast" "chilli" "itsfry" "pokimane" > sources.txt ;;
              1) printf '%s\n' "mrbeast" "tiktok" "chilli" "itsfry" "pokimane" > sources.txt ;;
              2) printf '%s\n' "chilli" "tiktok" "mrbeast" "itsfry" "pokimane" > sources.txt ;;
            esac
          fi
          echo "sources:"; cat -n sources.txt

      - name: Download up to 20 trending videos (≤1080p, titled filenames)
        run: |
          mkdir -p downloaded
          COUNT=0
          while IFS= read -r creator; do
            [ -z "$creator" ] && continue
            echo "Scraping @$creator ..."
            python3 -m yt_dlp \
              --impersonate "chrome-136" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -f "bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best[ext=mp4][height<=1080]" \
              --merge-output-format mp4 --remux-video mp4 \
              --no-part --no-overwrite \
              --concurrent-fragments 8 \
              --sleep-interval 1 --max-sleep-interval 2 \
              --retries infinite --fragment-retries 10 \
              --write-info-json \
              --playlist-end 8 \
              --output "downloaded/%(title)s [%(id)s].%(ext)s" \
              "https://www.tiktok.com/@${creator}" \
              || echo "WARN: @$creator scrape failed — continuing"
            COUNT=$(ls downloaded/*.mp4 2>/dev/null | wc -l)
            [ "$COUNT" -ge 20 ] && break
          done < sources.txt

          # keep exactly the 20 largest (highest quality)
          ls -S downloaded/*.mp4 2>/dev/null | tail -n +21 | xargs -r rm -f
          echo "Kept $(ls downloaded/*.mp4 2>/dev/null | wc -l) videos (max 20)"

      - name: Build manifest (title + uploader + id + size)
        run: |
          python3 - <<'PY'
          import json, glob, os
          videos = []
          for mp4 in sorted(glob.glob("downloaded/*.mp4")):
              base = os.path.splitext(mp4)[0]
              meta = base + ".info.json"
              title = uploader = vid_id = ""
              if os.path.exists(meta):
                  try:
                      m = json.load(open(meta))
                      title = m.get("title","")
                      uploader = m.get("uploader","") or m.get("uploader_id","")
                      vid_id = m.get("id","")
                  except Exception:
                      pass
              videos.append({
                  "file": os.path.basename(mp4),
                  "title": title,
                  "uploader": uploader,
                  "id": vid_id,
                  "size_mb": round(os.path.getsize(mp4)/1e6, 1),
              })
          json.dump({"videos": videos, "count": len(videos)},
                     open("manifest.json","w"), indent=2, ensure_ascii=False)
          print(f"Manifest: {len(videos)} videos")
          for v in videos:
              print(f"  - {v['title'][:55]}…  @{v['uploader']}  {v['size_mb']}MB")
          PY

      - name: Create or reuse today's release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          REL_TAG="${{ inputs.tag }}-${DATE}"
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

          # create a fresh release for today's date (tag becomes the build id)
          gh release view "$REL_TAG" -R "${{ github.repository }}" >/dev/null 2>&1 \
            && echo "Reusing release: $REL_TAG (already exists)" \
            || gh release create "$REL_TAG" -R "${{ github.repository }}" \
                 --title "TikTok batch — $DATE" \
                 --notes "20 trending TikTok videos (highest quality ≤1080p), named by title. See manifest.json."

      - name: Upload videos + manifest as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          gh release upload "$TAG" manifest.json -R "${{ github.repository }}" --clobber
          gh release upload "$TAG" downloaded/*.mp4 -R "${{ github.repository }}" --clobber
          echo "=== Release assets ==="
          gh release view "$TAG" -R "${{ github.repository }}" --json name | jq -r '.[].name'

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          echo "✅ Done. Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
