name: Download TikTok Videos → GitHub Release

on:
  schedule:
    # every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag prefix (default: reels)'
        required: false
        default: 'reels'
      creator:
        description: 'Override: single TikTok creator username to source from'
        required: false
        default: ''
      max_videos:
        description: 'Max number of videos to download per run (default: 60)'
        required: false
        default: '60'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release + upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp + ffmpeg + jq + curl-cffi (for TikTok impersonation)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq
          python3 -m pip install --quiet "yt-dlp[curl-cffi]"

      - name: Source list — trending creators (30+ accounts)
        id: src
        run: |
          MAX_V="${{ inputs.max_videos }}"
          echo "max_videos=$MAX_V" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.creator }}" ]; then
            printf '%s\n' "${{ inputs.creator }}" > sources.txt
          else
            # 35 high-profile public creators whose content trends on the FYP.
            # Rotation by hour-of-day spreads load + gives variety each run.
            HOUR=$(date -u +%H)
            printf '%s\n' "tiktok" "mrbech" "mrbeast" "chilli" "itsfry" \
              "pokimane" "khabylame" "bella Poarch" "charlidamelio" "addisonre" \
              "zachking" "mrmarkz" "dixie" "shutupmike" "dude" \
              "nikkietutorials" "jannat" "aryan" "gurmit" "amazing_ryans" \
              "laurencolesmith" "nikkita" "larray" "spencer" "josh2funny" \
              "shane" "dodocool" "tasty" "buzzfeedtasty" "nasa" > sources.txt
            # rotate the order so each 30-min run starts a different creator
            ROT=$(( HOUR % 5 ))
            for i in $(seq 1 $ROT); do
              # rotate first line to back
              tail -n 1 sources.txt > /tmp/_rot.txt; head -n -1 sources.txt >> /tmp/_rot.txt; mv /tmp/_rot.txt sources.txt
            done
          fi
          echo "sources:"; cat -n sources.txt

      - name: Download trending videos (highest quality ≤1080p, real titles)
        run: |
          MAX_V="${{ env.max_videos }}"
          mkdir -p downloaded raw
          COUNT=0
          while IFS= read -r creator; do
            [ -z "$creator" ] && continue
            echo "Scraping @$creator ..."
            # yt-dlp saves to `raw/` using the video TITLE in the filename.
            # We sanitize afterward so GitHub release assets have safe names.
            python3 -m yt_dlp \
              --impersonate "chrome-136" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -f "bestvideo[ext=mp4][height<=1080][vcodec!=none]+bestaudio[ext=m4a]/best[ext=mp4][height<=720]/best[ext=mp4]" \
              --merge-output-format mp4 \
              --no-part --no-overwrite \
              --concurrent-fragments 8 \
              --sleep-interval 1 --max-sleep-interval 2 \
              --retries infinite --fragment-retries 10 \
              --write-info-json \
              --playlist-end 3 \
              --output "raw/%(title)s [%(id)s].%(ext)s" \
              "https://www.tiktok.com/@${creator}" \
              || echo "WARN: @$creator scrape failed — continuing"
            COUNT=$(ls raw/*.mp4 2>/dev/null | wc -l)
            echo "  total so far: $COUNT / $MAX_V"
            [ "$COUNT" -ge "$MAX_V" ] && break
          done < sources.txt

          # keep exactly the MAX_V largest (highest quality)
          ls -S raw/*.mp4 2>/dev/null | tail -n +$((MAX_V + 1)) | xargs -r rm -f
          echo "Raw videos: $(ls raw/*.mp4 2>/dev/null | wc -l)"

      - name: Sanitize filenames (keep titles in manifest)
        run: |
          MAX_V="${{ env.max_videos }}"
          mkdir -p downloaded
          n=0
          for f in raw/*.mp4; do
            [ -f "$f" ] || continue
            n=$((n+1))
            # safe filename: video_01_<videoid>.mp4
            vidid=$(python3 -c "import json,os;b=os.path.splitext(os.path.basename('$f'))[0];m=b[b.rfind('[')+1:b.rfind(']')];print(m)" 2>/dev/null || echo "$n")
            cp "$f" "downloaded/video_$(printf '%04d' $n)_${vidid}.mp4"
          done
          # carry the info.json files (renamed) so manifest builder can read titles
          for j in raw/*.info.json; do
            [ -f "$j" ] || continue
            base=$(basename "$j" .info.json)
            vidid=$(python3 -c "b='$base';print(b[b.rfind('[')+1:b.rfind(']')])" 2>/dev/null || echo "?")
            cp "$j" "downloaded/video_meta_${vidid}.json"
          done
          echo "Sanitized: $(ls downloaded/*.mp4 2>/dev/null | wc -l) videos in downloaded/"

      - name: Build manifest (real title + uploader + id + size)
        run: |
          python3 - <<'PY'
          import json, glob, os, re
          videos = []
          # match sanitized mp4 to its meta json by videoid
          meta_by_id = {}
          for jf in glob.glob("downloaded/video_meta_*.json"):
              try:
                  m = json.load(open(jf))
                  meta_by_id[m.get("id","")] = m
              except Exception:
                  pass
          for mp4 in sorted(glob.glob("downloaded/video_*.mp4")):
              # extract videoid from filename: video_0001_<vidid>.mp4
              m = re.search(r'video_\d+_([0-9a-zA-Z-]+)\.mp4$', mp4)
              vid_id = m.group(1) if m else ""
              meta = meta_by_id.get(vid_id, {})
              videos.append({
                  "file": os.path.basename(mp4),
                  "title": meta.get("title","(unknown)"),
                  "uploader": meta.get("uploader", meta.get("uploader_id","")),
                  "id": vid_id,
                  "size_mb": round(os.path.getsize(mp4)/1e6, 1),
              })
          json.dump({"videos": videos, "count": len(videos)},
                     open("manifest.json","w"), indent=2, ensure_ascii=False)
          print(f"Manifest: {len(videos)} videos")
          for v in videos[:6]:
              print(f"  - {v['title'][:50]}…  @{v['uploader']}  {v['size_mb']}MB")
          PY

      - name: Create or reuse today's release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each 30-min run → a fresh timestamped release (reels-YYYY-MM-DD-HHMM)
          # so the Worker can always fetch the latest batch without conflicts.
          STAMP="$(date -u +%Y-%m-%d-%H%M)"
          REL_TAG="${{ inputs.tag }}-${STAMP}"
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

          gh release create "$REL_TAG" -R "${{ github.repository }}" \
               --title "TikTok Reels batch — $STAMP UTC" \
               --notes "Fresh batch of ${MAX_V} trending TikTok reels (highest quality ≤1080p). Filenames sanitized; manifest.json maps each to real title/uploader/id."

      - name: Upload sanitized videos + manifest as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          REPO="${{ github.repository }}"
          gh release upload "$TAG" manifest.json -R "$REPO"
          shopt -s nullglob
          for f in downloaded/video_*.mp4; do
            gh release upload "$TAG" "$f" -R "$REPO" \
              || echo "WARN: failed to upload $f — continuing"
          done
          echo "=== Release assets ($(ls downloaded/video_*.mp4 2>/dev/null | wc -l) videos) ==="
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'

      - name: Summary
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          echo "✅ Done. Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
