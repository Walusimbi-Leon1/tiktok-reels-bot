name: Download & Stage TikTok Videos

on:
  schedule:
    # daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      username:
        description: 'TikTok username to source from (optional — fallback to For You feed)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp + ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pipx install yt-dlp

      - name: Determine source
        id: source
        run: |
          USERNAME="${{ inputs.username }}"
          if [ -z "$USERNAME" ]; then
            # For You feed = trending, high-quality, no auth required.
            SOURCE="https://www.tiktok.com/foryou"
            echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
            echo "Using For You feed (trending)"
          else
            SOURCE="https://www.tiktok.com/@${USERNAME}"
            echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
            echo "Using source user: $USERNAME"
          fi

      - name: Download trending videos (highest quality ≤1080p)
        run: |
          mkdir -p downloaded
          # bestvideo[height<=1080]+bestaudio → avoids the tiktok 720p throttles;
          # --remux-video mp4 gives clean IG/FB-compatible reels.
          # --sleep-interval keeps us under rate limits; retries infinite.
          yt-dlp \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -f "bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best[ext=mp4][height<=1080]" \
            --merge-output-format mp4 \
            --remux-video mp4 \
            --no-part --no-overwrite \
            --concurrent-fragments 8 \
            --sleep-interval 1 --max-sleep-interval 3 \
            --retries infinite --fragment-retries 10 \
            --write-info-json --write-description --embed-thumbnail \
            --extract-audio false \
            --playlist-end 20 \
            --output "downloaded/%(uploader)s-%(id)s.%(ext)s" \
            "${{ steps.source.outputs.source }}" \
            || echo "WARN: partial/failed download — keeping whatever succeeded"

      - name: Keep top-N by file size (highest quality)
        run: |
          # sort downloaded mp4s by size, keep the 5 largest
          ls -S downloaded/*.mp4 2>/dev/null | tail -n +6 | xargs -r rm -f
          echo "Kept videos:"
          ls -la downloaded/*.mp4 2>/dev/null || echo "(none)"

      - name: Build manifest
        run: |
          python3 - <<'PY'
          import json, glob, os
          videos = []
          for mp4 in sorted(glob.glob("downloaded/*.mp4")):
              base = os.path.splitext(mp4)[0]
              meta = base + ".info.json"
              title = desc = uploader = vid_id = ""
              if os.path.exists(meta):
                  try:
                      m = json.load(open(meta))
                      title = m.get("title","")
                      desc = m.get("description","")
                      uploader = m.get("uploader","") or m.get("uploader_id","")
                      vid_id = m.get("id","")
                  except Exception:
                      pass
              videos.append({
                  "file": os.path.basename(mp4),
                  "path": mp4,
                  "title": title,
                  "uploader": uploader,
                  "id": vid_id,
                  "size_mb": round(os.path.getsize(mp4)/1e6, 1),
              })
          json.dump({"videos": videos},
                     open("manifest.json","w"), indent=2)
          print(f"Manifest: {len(videos)} videos")
          for v in videos:
              print(f"  - {v['file']}  {v['size_mb']}MB  @{v['uploader']}")
          PY

      - name: Upload staged videos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staged-tiktok-videos-${{ github.run_number }}
          path: |
            downloaded/*.mp4
            manifest.json
          retention-days: 3
          compression-level: 0

      - name: Show staged files
        run: |
          echo "=== Staged for publish ==="
          cat manifest.json
