name: Publish Reels to Instagram + Facebook

# Runs after Download & Stage. Publishes each staged .mp4 as:
#   - Instagram Reel  (IG is the PRIMARY channel)
#   - Facebook Reel   (via the Facebook Page videos endpoint)
#
# Requires repository secrets (NEVER stored in-repo):
#   IG_ACCESS_TOKEN  — long-lived user token.
#                      Scopes: instagram-contentpublish, pages_manage_posts,
#                              pages_read_engagement, pages_show_list
#   IG_ACCOUNT_ID    — Instagram Business/Creator user id (numeric)
#   FB_PAGE_ID       — linked Facebook Page id (numeric)
#
# IG reels need the video at a PUBLIC https url. In CI we upload to a throwaway
# public host (transfer.sh) — delete after posting. FB accepts direct file
# upload via multipart/form-data.

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Artifact name from the download job (e.g. staged-tiktok-videos-42)'
        required: true
      caption:
        description: 'Caption for the reels (default: a trending tag)'
        required: false
        default: '🔥 Trending now on TikTok #fyp #viral'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GRAPH: "https://graph.facebook.com/v18.0"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install curl + jq
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Download staged artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: staged/

      - name: Verify artifact
        run: |
          ls -la staged/
          [ -f staged/manifest.json ] || { echo "manifest.json missing"; exit 1; }
          cat staged/manifest.json

      - name: Check Meta secrets
        run: |
          : "${IG_ACCESS_TOKEN:?need IG_ACCESS_TOKEN secret}"
          : "${IG_ACCOUNT_ID:?need IG_ACCOUNT_ID secret}"
          : "${FB_PAGE_ID:?need FB_PAGE_ID secret}"
          echo "Meta secrets present."

      - name: Publish each video
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FB_ID: ${{ secrets.FB_PAGE_ID }}
          CAPTION: "${{ inputs.caption }}"
        run: |
          set -e
          for mp4 in staged/*.mp4; do
            [ -f "$mp4" ] || continue
            VID="$(basename "$mp4")"
            echo "=== Publishing $VID ==="

            # -- 1. Upload to a temporary PUBLIC url (IG containers need https url) --
            echo "Uploading $VID to transfer.sh..."
            PUB=$(curl -s --upload-file "$mp4" "https://transfer.sh/$VID")
            echo "public url: $PUB"

            # -- 2. Instagram REEL (primary) --
            # Create media container
            echo "Creating IG reel container..."
            CID=$(curl -s -X POST "$GRAPH/$IG_ID/media" \
              -d "media_type=REELS" \
              -d "video_url=$PUB" \
              --data-urlencode "caption=$CAPTION" \
              -d "access_token=$TOKEN" | jq -r '.id // empty')
            if [ -z "$CID" ]; then
              echo "❌ IG container creation failed for $VID"; continue
            fi

            # Wait for the container to finish processing (CREATED → FINISHED/ERROR)
            echo "Waiting for IG container $CID to finish..."
            for i in $(seq 1 60); do
              STATUS=$(curl -s "$GRAPH/$CID?fields=status_code&access_token=$TOKEN" | jq -r '.status_code // empty')
              echo "  IG status: $STATUS"
              if [ "$STATUS" = "FINISHED" ]; then break; fi
              if [ "$STATUS" = "ERROR" ]; then echo "❌ IG processing error"; break; fi
              sleep 5
            done

            # Publish the reel
            echo "Publishing IG reel..."
            curl -s -X POST "$GRAPH/$IG_ID/media_publish" \
              -d "creation_id=$CID" \
              -d "access_token=$TOKEN"
            echo ""

            # -- 3. Facebook REEL (secondary) — direct file upload --
            echo "Publishing FB reel (direct upload)..."
            curl -s -X POST "$GRAPH/$FB_ID/videos" \
              -F "source=@${mp4}" \
              -F "caption=$CAPTION" \
              -F "access_token=$TOKEN"
            echo ""

            # -- 4. Clean up the temporary public upload --
            curl -s -X DELETE "$PUB" >/dev/null || true

            echo "✅ Done: $VID"
          done

      - name: Done
        run: echo "📦 All reels published (IG primary, FB secondary). Check Instagram first."
